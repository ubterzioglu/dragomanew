# Dragoman static site (the unzipped build) and the staff panel under /panel/. Include inside nginx's
# http {} block, e.g. as /etc/nginx/conf.d/dragoman.conf, then adjust listen, server_name and root,
# and replace __SUPABASE_ORIGIN__ and __ROBOTS_DEFAULT__ (the Dockerfile does both at build time).
# The build's build-meta/nginx-redirects.map must sit at /etc/nginx/dragoman-redirects.map (included below).
# TLS and HTTP/3 are expected to be handled by the server or proxy in front.

# Long site paths in the redirect map (below) need a bigger bucket than the 32/64-byte default. nginx takes
# this only before the first map block of the http {} context.
map_hash_bucket_size 256;

# Build output with a hash in the name never changes, so browsers may keep it for a year.
# Media and brand files keep their names when replaced, so they are cached for a day.
# HTML is revalidated on every visit (nginx sends ETag / Last-Modified).
map $uri $dragoman_cache_control {
    default                                    "no-cache";
    # The live release number (scripts/fetch-content.mjs); the panel polls it after a deploy.
    /release.json                              "no-store";
    ~^/assets/                                 "public, max-age=31536000, immutable";
    ~^/static-loader-data/                     "public, max-age=31536000, immutable";
    ~^/static-loader-data-manifest-.+\.json$   "public, max-age=31536000, immutable";
    ~^/(media|brand)/                          "public, max-age=86400";
    # Staff panel: hashed bundles like the site's; its one HTML file is never stored.
    ~^/panel/assets/                           "public, max-age=31536000, immutable";
    ~^/panel/                                  "no-store";
}

# Site pages carry their own policy in a meta tag (script hashes, connect-src with the forms' Supabase
# origin); this header adds only what a meta tag cannot set. With no default-src or connect-src it never
# blocks the forms' fetch to Supabase: header and meta policies both apply, so each must allow it.
# The panel has no inline scripts, so its whole policy is here. The Dockerfile replaces
# __SUPABASE_ORIGIN__ with the origin of VITE_SUPABASE_URL; img-src data: is for the TOTP QR code,
# blob: for photos picked for upload and the Supabase origin for signed thumbnails of uploaded media.
map $uri $dragoman_csp {
    default     "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    ~^/panel/   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __SUPABASE_ORIGIN__; connect-src 'self' __SUPABASE_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# Search indexing of pages, images and data files. The Dockerfile replaces __ROBOTS_DEFAULT__ from
# VITE_PUBLIC_RELEASE: "noindex, nofollow" for the Stage A preview, "" for a public release (nginx sends
# no header for an empty value). The panel stays out of indexes either way.
map $uri $dragoman_robots {
    default     "__ROBOTS_DEFAULT__";
    ~^/panel/   "noindex, nofollow";
}

# Each language has its own prerendered 404 page; English lives at the root. Case-sensitive like the
# files and the site's router (routes.tsx), so /TR/ is a missing English address on both sides.
map $uri $dragoman_not_found {
    default      /404/index.html;
    ~^/tr(/|$)   /tr/404/index.html;
    ~^/fr(/|$)   /fr/404/index.html;
    ~^/de(/|$)   /de/404/index.html;
}

# Slug-change redirects (SEO-02, dalga2-sozlesme §7): "<old path> <new path>;" lines that
# scripts/fetch-content.mjs writes from the release's slug history into build-meta/nginx-redirects.map;
# the Dockerfile copies it here (a fixture build ships a comment-only file). Removed pages are not
# listed and answer 404.
map $uri $dragoman_redirect {
    default "";
    include /etc/nginx/dragoman-redirects.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name notyetbro.club;

    root /var/www/dragoman;
    index index.html;
    charset utf-8;

    # Behind a proxy: send /tr -> /tr/ as a relative redirect, never http://host:80/tr/.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # add_header is inherited only by locations without their own add_header: keep them all here,
    # and vary them by path with the maps above.
    add_header Cache-Control $dragoman_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # No script-src for the site: every page has inline scripts, so script rules need per-page hashes.
    add_header Content-Security-Policy $dragoman_csp always;
    add_header X-Robots-Tag $dragoman_robots always;
    # Turn on once every http:// request is redirected to https:// (1 year, this host only).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # /tr/index.html would show the page at an address the site's router does not know. Matched on the
    # original request, so nginx's own internal redirects to index.html and the 404 pages are untouched.
    # The folder must not start with a second / or \ (\x5c): browsers read "//evil.example/" and
    # "/\evil.example/" as another site.
    if ($request_uri ~ "^(/(?:[^/\x5c?][^?]*/)?)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # An old address of a moved event, post or product: permanent, relative (absolute_redirect off),
    # with the query string kept.
    if ($dragoman_redirect) {
        return 301 $dragoman_redirect$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Staff panel (panel/ in the repo): a single-page app, so any address under /panel/ that is not a
    # file gets its index.html and the app's router picks the screen. A prefix, not ^~, so the
    # dot-file rule below still applies here.
    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    # A missing bundle stays a 404 instead of becoming the panel's HTML.
    location /panel/assets/ {
        try_files $uri =404;
    }

    # Older mime.types files lack AVIF; without this the images are sent as application/octet-stream.
    location ~* \.avif$ {
        types { }
        default_type image/avif;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # 403: a build folder without index.html (/tr/urun/ only holds product pages) is a missing page too.
    error_page 403 404 =404 $dragoman_not_found;
}
